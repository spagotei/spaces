name: Build Spaces Android AAB

on:
  workflow_dispatch:
    inputs:
      play_version_code:
        description: 'NEW integer Android versionCode (higher than every code in Play Console)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build signed Android 0.2.28 APK and Google Play AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Spaces
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;28.2.13676358'

      - name: Configure Android NDK
        shell: bash
        run: |
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install npm dependencies
        run: npm ci

      - name: Sync Spaces version
        run: npm run version:sync

      - name: Validate Spaces mobile source
        run: |
          npm run beta:gate
          npm run typecheck
          npm run voice:dm:check
          npm run voice:polish:check

      - name: Set Google Play version code
        shell: bash
        env:
          PLAY_VERSION_CODE: ${{ inputs.play_version_code }}
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const raw = process.env.PLAY_VERSION_CODE || ''
          if (!/^[1-9][0-9]{0,9}$/.test(raw)) throw new Error('Enter a valid positive integer Play versionCode.')
          const code = Number(raw)
          if (!Number.isSafeInteger(code) || code > 2100000000) throw new Error('Play versionCode must be <= 2100000000.')
          const file = 'src-tauri/tauri.conf.json'
          const config = JSON.parse(fs.readFileSync(file, 'utf8'))
          if (config.identifier !== 'com.spagotei.spaces') throw new Error('Android application ID changed; this would not update the existing Spaces app.')
          config.bundle ??= {}
          config.bundle.android ??= {}
          config.bundle.android.versionCode = code
          fs.writeFileSync(file, JSON.stringify(config, null, 2) + '\n')
          const gradle = fs.readFileSync('src-tauri/gen/android/app/build.gradle.kts', 'utf8')
          if (!/targetSdk\s*=\s*36\b/.test(gradle)) throw new Error('Android targetSdk must be 36 or higher for Play updates in October 2026.')
          const manifest = fs.readFileSync('src-tauri/gen/android/app/src/main/AndroidManifest.xml', 'utf8')
          for (const permission of ['RECORD_AUDIO', 'CAMERA']) {
            if (!manifest.includes('android.permission.' + permission)) throw new Error('Missing Android ' + permission + ' permission.')
          }
          console.log(`Verified ${config.identifier} v${config.version} versionCode ${code}, targetSdk 36`)
          NODE

      - name: Configure Android upload signing
        shell: bash
        env:
          KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          EXPECTED_UPLOAD_SHA256: ${{ vars.ANDROID_UPLOAD_CERT_SHA256 }}
        run: |
          set -euo pipefail
          if [[ -z "$KEY_BASE64" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo 'Missing ANDROID_KEY_BASE64, ANDROID_KEY_ALIAS, or ANDROID_KEY_PASSWORD in GitHub Actions secrets.' >&2
            exit 1
          fi
          umask 077
          printf '%s' "$KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/spaces-upload-keystore.jks"
          test -s "$RUNNER_TEMP/spaces-upload-keystore.jks"
          keytool -list -keystore "$RUNNER_TEMP/spaces-upload-keystore.jks" -storepass "$KEY_PASSWORD" -alias "$KEY_ALIAS" > "$RUNNER_TEMP/spaces-cert.txt"
          fingerprint=$(keytool -list -v -keystore "$RUNNER_TEMP/spaces-upload-keystore.jks" -storepass "$KEY_PASSWORD" -alias "$KEY_ALIAS" | sed -n 's/.*SHA256: //p' | head -n 1)
          if [[ -z "$fingerprint" ]]; then echo 'Cannot determine upload key certificate SHA-256' >&2; exit 1; fi
          normalize() { printf '%s' "$1" | tr -d ': ' | tr '[:lower:]' '[:upper:]'; }
          if [[ -n "$EXPECTED_UPLOAD_SHA256" && "$(normalize "$EXPECTED_UPLOAD_SHA256")" != "$(normalize "$fingerprint")" ]]; then
            echo 'Upload key fingerprint does not match ANDROID_UPLOAD_CERT_SHA256. Refusing release build.' >&2
            exit 1
          fi
          if [[ -z "$EXPECTED_UPLOAD_SHA256" ]]; then
            echo 'WARNING: ANDROID_UPLOAD_CERT_SHA256 is not configured. Compare this fingerprint with Play Console before uploading.'
          fi
          echo "Spaces upload certificate SHA-256: $fingerprint"
          echo "Upload key SHA-256: $fingerprint" >> "$GITHUB_STEP_SUMMARY"
          cat > src-tauri/gen/android/keystore.properties <<PROPERTIES
          keyAlias=$KEY_ALIAS
          password=$KEY_PASSWORD
          storeFile=$RUNNER_TEMP/spaces-upload-keystore.jks
          PROPERTIES
          chmod 600 src-tauri/gen/android/keystore.properties

      - name: Make Gradle wrapper executable
        run: chmod +x src-tauri/gen/android/gradlew

      - name: Build Android debug test APK
        run: npx tauri android build --debug --apk

      - name: Upload separate debug APK
        uses: actions/upload-artifact@v7
        with:
          name: Spaces-Android-Test-APK
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Build signed Google Play AAB
        run: npx tauri android build --aab

      - name: Verify signed AAB and versionCode
        shell: bash
        env:
          PLAY_VERSION_CODE: ${{ inputs.play_version_code }}
        run: |
          set -euo pipefail
          aab=$(find src-tauri/gen/android/app/build/outputs/bundle -type f -name '*.aab' -print -quit)
          test -n "$aab" && test -s "$aab"
          verified=$(jarsigner -verify "$aab")
          echo "$verified"
          if [[ "$verified" != *"jar verified."* ]]; then echo "AAB signature verification failed" >&2; exit 1; fi
          props='src-tauri/gen/android/app/tauri.properties'
          test -f "$props"
          actual=$(sed -n 's/^tauri.android.versionCode=//p' "$props" | head -n 1 | tr -d '\r')
          if [[ "$actual" != "$PLAY_VERSION_CODE" ]]; then
            echo "Unexpected AAB versionCode property: '$actual' expected '$PLAY_VERSION_CODE'" >&2
            exit 1
          fi
          echo "Signed AAB: $aab"
          echo "Play versionCode: $actual" >> "$GITHUB_STEP_SUMMARY"
          echo "NOTE: The AAB is NOT uploaded to Google Play automatically." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload signed Spaces Google Play AAB
        uses: actions/upload-artifact@v7
        with:
          name: Spaces-Android-AAB
          path: src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: error
