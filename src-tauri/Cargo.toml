[package]
name = "spaces-app"
version = "0.0.23"
description = "Spaces standalone desktop client"
authors = ["Scrounge"]
edition = "2021"

[lib]
name = "spaces_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

tauri-plugin-updater = "2"
tauri-plugin-process = "2"
