<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#09090d" />
    <meta name="color-scheme" content="dark" />
    <meta name="application-name" content="Spaces" />
    <meta name="description" content="Private collaborative Spaces for conversations, notes and teams." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icon-128.png" />
    <title>Spaces</title>
    <!-- SPACES_STARTUP_LOADING_HEAD -->
<style>
  :root {
    --spaces-boot-bg: #09090c;
    --spaces-boot-text: rgba(255,255,255,.94);
    --spaces-boot-muted: rgba(255,255,255,.46);
    --spaces-boot-accent: #9d7bc6;
  }

  html:not(.spaces-app-ready) #root {
    opacity: 0;
    transform: scale(.997);
  }

  html.spaces-app-ready #root {
    opacity: 1;
    transform: scale(1);
    transition:
      opacity 360ms cubic-bezier(.22,.8,.2,1),
      transform 420ms cubic-bezier(.22,.8,.2,1);
  }

  #spaces-preboot {
    position: fixed;
    inset: 0;
    z-index: 2147483646;
    display: grid;
    place-items: center;
    overflow: hidden;
    background:
      radial-gradient(circle at 50% 47%, rgba(157,123,198,.11), transparent 24rem),
      linear-gradient(180deg, #0a0a0d 0%, var(--spaces-boot-bg) 100%);
    color: var(--spaces-boot-text);
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
    transition:
      opacity 440ms cubic-bezier(.22,.8,.2,1),
      visibility 440ms step-end;
    font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  html.spaces-app-ready #spaces-preboot {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

  .spaces-preboot-card {
    position: relative;
    width: min(330px, calc(100vw - 48px));
    display: grid;
    justify-items: center;
    gap: 20px;
    padding: 28px;
    border: 1px solid rgba(255,255,255,.09);
    border-radius: 24px;
    background: rgba(255,255,255,.035);
    box-shadow: 0 28px 90px rgba(0,0,0,.44);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    animation: spacesBootCardIn 480ms cubic-bezier(.2,.82,.2,1) both;
  }

  .spaces-preboot-mark {
    height: 50px;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 6px;
  }

  .spaces-preboot-mark i {
    display: block;
    width: 7px;
    height: 7px;
    border: 1px solid rgba(255,255,255,.68);
    border-radius: 999px;
    background: transparent;
    transform-origin: 50% 100%;
    animation: spacesBootBuild 1.65s cubic-bezier(.3,.72,.25,1) infinite;
  }

  .spaces-preboot-mark i:nth-child(2) { animation-delay: 110ms; }
  .spaces-preboot-mark i:nth-child(3) { animation-delay: 220ms; }

  .spaces-preboot-copy {
    display: grid;
    justify-items: center;
    gap: 6px;
  }

  .spaces-preboot-copy strong {
    font-size: 22px;
    line-height: 1;
    letter-spacing: -.035em;
    font-weight: 760;
  }

  .spaces-preboot-copy span {
    font-size: 11px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--spaces-boot-muted);
  }

  .spaces-preboot-progress {
    width: min(190px, 65vw);
    height: 2px;
    overflow: hidden;
    border-radius: 999px;
    background: rgba(255,255,255,.06);
  }

  .spaces-preboot-progress::after {
    content: "";
    display: block;
    width: 42%;
    height: 100%;
    border-radius: inherit;
    background: linear-gradient(
      90deg,
      transparent,
      rgba(255,255,255,.78),
      var(--spaces-boot-accent),
      transparent
    );
    animation: spacesBootSweep 1.25s cubic-bezier(.45,0,.2,1) infinite;
  }

  @keyframes spacesBootBuild {
    0%, 100% { height: 7px; border-radius: 999px; opacity: .52; }
    34% { height: 27px; border-radius: 4px 4px 2px 2px; opacity: 1; }
    58% { height: 42px; border-radius: 4px 4px 2px 2px; opacity: .92; }
    78% { height: 12px; border-radius: 5px; opacity: .66; }
  }

  @keyframes spacesBootSweep {
    from { transform: translateX(-145%); }
    to { transform: translateX(345%); }
  }

  @keyframes spacesBootCardIn {
    from { opacity: 0; transform: translateY(8px) scale(.985); filter: blur(3px); }
    to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    #spaces-preboot,
    .spaces-preboot-card,
    .spaces-preboot-mark i,
    .spaces-preboot-progress::after,
    #root {
      animation: none !important;
      transition-duration: 120ms !important;
    }
  }
</style>
    <style id="spaces-preboot-style">html,body,#root{margin:0;min-height:100%;background:#09080d}#spaces-preboot{position:fixed;inset:0;display:grid;place-items:center;background:#09080d;overflow:hidden}#spaces-preboot video{display:block;background:transparent}</style>

  <style id="spaces-preboot-style-v77">html,body,#root{margin:0;width:100%;min-height:100%;background:#09080d}#spaces-preboot-v77{position:fixed;inset:0;display:grid;place-items:center;background:#09080d;overflow:hidden}#spaces-preboot-v77 video{display:block;width:100%;height:100%;object-fit:contain;background:transparent}</style>
    <!-- SPACES_ANDROID_STATIC_SPLASH_V25: mobile-only, still logo; desktop video stays unchanged. -->
  <style id="spaces-mobile-static-startup-style">
    .spaces-native-boot-logo { display: none !important; }
    html.spaces-mobile-static-boot #spaces-preboot {
      background: #09090d !important;
    }
    html.spaces-mobile-static-boot #spaces-preboot .spaces-preboot-card { display: none !important; }
    html.spaces-mobile-static-boot #spaces-preboot > .spaces-native-boot-logo,
    html.spaces-mobile-static-boot #spaces-preboot-v77 .spaces-native-boot-logo { display: block !important; }
    html.spaces-mobile-static-boot .spaces-native-boot-logo,
    html.spaces-mobile-static-boot .spaces-mobile-static-splash img {
      width: 112px !important;
      height: 112px !important;
      object-fit: contain !important;
      filter: none !important;
      animation: none !important;
      transition: none !important;
    }
    html.spaces-mobile-static-boot #spaces-preboot-v77 {
      display: grid !important;
      place-items: center !important;
      width: 100% !important;
      min-height: 100dvh !important;
      background: #09090d !important;
    }
    html.spaces-mobile-static-boot #spaces-preboot-v77 video { display: none !important; }
    html.spaces-mobile-static-boot .spaces-mobile-static-splash {
      display: grid !important;
      place-items: center !important;
      width: 100% !important;
      min-height: 100dvh !important;
      background: #09090d !important;
      animation: none !important;
    }
    #spaces-mobile-startup-recovery {
      position: fixed;
      inset: 0;
      z-index: 2147483647;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 16px;
      padding: 32px;
      background: #09090d;
      color: #fff;
      text-align: center;
      font: 15px/1.5 system-ui, sans-serif;
    }
    #spaces-mobile-startup-recovery img { width: 100px; height: 100px; object-fit: contain; }
    #spaces-mobile-startup-recovery strong { font-size: 19px; }
    #spaces-mobile-startup-recovery p { max-width: 320px; margin: 0; color: #b8b3c1; }
    #spaces-mobile-startup-recovery button {
      margin-top: 6px;
      min-height: 46px;
      padding: 0 26px;
      border: 0;
      border-radius: 12px;
      background: #8b6ca8;
      color: #fff;
      font: 650 15px system-ui, sans-serif;
    }
  </style>
</head>
  <body>
    <!-- SPACES_STARTUP_LOADING_BODY -->
<div id="spaces-preboot" role="status" aria-live="polite" aria-label="Loading Spaces">
  <div class="spaces-preboot-card">
    <div class="spaces-preboot-mark" aria-hidden="true"><i></i><i></i><i></i></div>
    <div class="spaces-preboot-copy">
      <strong>Spaces</strong>
      <span>Opening your workspace</span>
    </div>
    <div class="spaces-preboot-progress" aria-hidden="true"></div>
  </div>
  <img class="spaces-native-boot-logo" src="/icon-256.png" alt="Spaces" />
</div>

    <div id="root"><main id="spaces-preboot-v77"><video autoplay muted loop playsinline preload="auto" src="/Spaces-Bootloading-V77-transparent.webm"></video><img class="spaces-native-boot-logo" src="/icon-256.png" alt="Spaces" /></main></div>

    <!-- SPACES_ANDROID_STATIC_SPLASH_V25: start even if the React JavaScript bundle never initializes. -->
    <script id="spaces-mobile-boot-watchdog">
    (function () {
      if (!/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) return;
      document.documentElement.classList.add('spaces-mobile-static-boot');
      var ready = false;
      window.addEventListener('spaces:mobile-ui-ready', function () {
        ready = true;
        var recovery = document.getElementById('spaces-mobile-startup-recovery');
        if (recovery) recovery.remove();
      }, { once: true });
      // If the bundle fails to load or session restore never completes, stop showing a silent splash.
      window.setTimeout(function () {
        if (ready) return;
        var panel = document.createElement('section');
        panel.id = 'spaces-mobile-startup-recovery';
        panel.setAttribute('role', 'alert');
        var logo = document.createElement('img');
        logo.src = '/icon-256.png';
        logo.alt = 'Spaces';
        var title = document.createElement('strong');
        title.textContent = 'Spaces could not finish starting';
        var message = document.createElement('p');
        message.textContent = 'Please try again. If it still stops here, the Android app needs a startup diagnostic.';
        var retry = document.createElement('button');
        retry.type = 'button';
        retry.textContent = 'Try again';
        retry.addEventListener('click', function () { window.location.reload(); });
        panel.appendChild(logo);
        panel.appendChild(title);
        panel.appendChild(message);
        panel.appendChild(retry);
        document.body.appendChild(panel);
      }, 12000);
    })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
